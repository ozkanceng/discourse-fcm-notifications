plugins:
  fcm_notifications_enabled:
    default: false
    client: true
  fcm_notifications_project_id:
    default: ''
  fcm_notifications_api_key:
    default: ''
  fcm_notifications_google_json:
    default: ''
  fcm_notifications_hide_private_excerpt:
    default: true
    description: 'Do not put private message text into push notification bodies'
  sorumatik_ai_live_streaming_enabled:
    default: false
    client: true
    description: 'Publish user-scoped AI answer snapshots over MessageBus'
  sorumatik_ai_live_stream_tag:
    default: 'soru-cozumu'
  sorumatik_ai_bot_username:
    default: 'sorumatik_ai'
  sorumatik_ai_stream_throttle_ms:
    default: 80
    min: 40
    max: 1000
  blackboard_tts_enabled:
    default: false
    description: 'Generate cached Kara Tahta narration with Gemini 2.5 Flash TTS'
  blackboard_gemini_api_key:
    default: ''
    secret: true
  blackboard_tts_model:
    default: 'gemini-3.8-flash-lite-tts'
    description: 'Gemini speech generation model'
  blackboard_openai_api_key:
    default: ''
    secret: true
    description: 'Deprecated; no longer used for Kara Tahta narration'
  blackboard_tts_voice:
    default: 'Kore'
  blackboard_tts_speed_version:
    default: '1'
  blackboard_tts_format:
    default: 'mp3'
    description: 'Preferred cached audio format; falls back to WAV when FFmpeg is unavailable'
  blackboard_premium_groups:
    default: ''
    type: list
    description: 'Verified paid Premium group names. When empty, all authenticated users have access (subject to daily limit).'
  blackboard_daily_limit:
    default: 5
    min: 1
    max: 100
    description: 'Daily Kara Tahta videos for app builds that do not send their tier (before the free/premium split)'
  blackboard_free_daily_limit:
    default: 1
    min: 0
    max: 100
    description: 'Daily Kara Tahta videos for free users (apps that send X-Sorumatik-Tier)'
  blackboard_premium_daily_limit:
    default: 10
    min: 1
    max: 100
    description: 'Daily Kara Tahta videos for premium users (blackboard_premium_groups, staff or apps reporting premium)'
  blackboard_rewarded_daily_limit:
    default: 2
    min: 0
    max: 10
    description: 'Extra Kara Tahta videos a user can unlock per UTC day with verified rewarded ads'
  sorumatik_api_receipt_secret:
    default: ''
    secret: true
    client: false
    description: 'Shared with the Sorumatik API (SORUMATIK_RECEIPT_SECRET): checks charge receipts of API-charged Kara Tahta videos'
  blackboard_admob_ssv_enabled:
    default: false
    description: 'Accept AdMob rewarded-ad callbacks at /sorumatik/blackboard-rewarded/ssv (set this URL on the rewarded ad unit first)'
  blackboard_free_help_daily_limit:
    default: 2
    min: 0
    max: 50
    description: 'Free "burayi anlamadim" questions per user and UTC day for non-premium users'
  blackboard_share_daily_limit:
    default: 30
    min: 1
    max: 500
    description: 'Kara Tahta share links a user can create per day'
